name: Nebula scoreboard

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may delay it a little at busy times)
  workflow_dispatch: {}          # "Run workflow" button for an instant refresh
  push:
    branches: [main]
    paths: ["catalog.json", "site/**", "scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scoreboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify flags and build the board
        env:
          NEBULA_KEY: ${{ secrets.NEBULA_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python3 scripts/build.py --out _site

      - name: Save state (first-seen time of each capture)
        run: |
          git config user.name "nebula-hq"
          git config user.email "nebula-hq@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "board: update state" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
